# Standalone futtatás Home Assistant nélkül (fejlesztéshez / önálló szerverhez).
# Home Assistant alatt az add-ont a Supervisor buildeli a willhaben-agent/ mappából.
services:
  app:
    build:
      context: ./willhaben-agent
      dockerfile: Dockerfile
    container_name: willhaben_search_agent
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      PORT: "5000"
      FLASK_ENV: production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
