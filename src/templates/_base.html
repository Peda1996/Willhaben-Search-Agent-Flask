<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Suchraum-Crawler" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4 sm:p-6">
        <nav class="flex flex-wrap gap-x-5 gap-y-2 mb-6 text-sm font-semibold text-blue-700">
            <a href="{{ url_for('index') }}" class="hover:underline">Suchen</a>
            {% if space %}
                <a href="{{ url_for('history', space=space.id) }}" class="hover:underline">Trefferhistorie</a>
                <a href="{{ url_for('space_settings', space_id=space.id) }}" class="hover:underline">Suchraum verwalten</a>
            {% endif %}
        </nav>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="bg-green-100 border-l-4 border-green-500 text-green-800 p-4 mb-5 rounded-r">
                    {% for message in messages %}<p>{{ message }}</p>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
